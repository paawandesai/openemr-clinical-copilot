# GitLab CI — the Week 2 eval gate, the agent's unit suite, and the dashboard.
#
# Four jobs: `w2-writeback-php` (the module's PHPUnit suite, below),
# `agent-unit-tests` (agent/tests/), `dashboard-tests` (dashboard/, only when
# it changes; both at the end of this file), and the gate.
# The gate job runs `python -m evals.w2.gate`, whose exit code IS the verdict, so
# nothing here parses output to decide anything:
#
#   0  PASS        every active case was scored and no rule fired
#   1  BLOCKED     a gate rule fired
#   2  ERROR       the gate could not run at all
#   3  INCOMPLETE  no rule fired, but a critical case was never scored
#
# 3 is why this job does NOT pass `--allow-incomplete`. Without
# ANTHROPIC_API_KEY the judge tier is skipped, every category-M case goes
# unscored, and all of them are critical — so the job FAILS. It used to pass
# with a notice, and a green pipeline that scored no critical case is the exact
# failure this gate exists to prevent. The local pre-push hook is the one
# caller that may say "not evidence" and carry on; CI may not.
#
# This file is a gate file: .claude/hooks/gate-lib.sh protects `.gitlab-ci.yml`,
# and only a session started with W2_GATE_SESSION=1 may change it. A branch that
# turns its own gate off is not a branch anyone can review as implementation
# work (CLAUDE.md invariant 7).
#
# ---------------------------------------------------------------------------
# Repository settings a human has to make, once. CI cannot do either of these:
#
#   1. Settings -> CI/CD -> Variables: add ANTHROPIC_API_KEY.
#      MASKED: yes.  PROTECTED: NO.
#      Not protected is the part that is easy to get wrong. A protected
#      variable is only exposed on protected branches and tags, so a merge
#      request from an ordinary feature branch would not see it — the judge
#      tier would skip on every MR, which is precisely the pipeline whose
#      result anyone cares about.
#
#   2. Settings -> Merge requests -> Merge checks: tick "Pipelines must
#      succeed". Without it this job reports and does not gate, and "the evals
#      pass" becomes a thing somebody read rather than a thing that held.
# ---------------------------------------------------------------------------

stages:
  # Two stages, not one, because the gate now SCORES the write-back job's
  # result rather than merely checking that the job is declared. The suite has
  # to have finished before the gate reads it, and `dependencies:` only fetches
  # artifacts from an earlier stage.
  - writeback
  - eval

# When a pipeline is created at all.
#
# The work order asks for merge requests and the default branch. The third rule
# below adds a branch pipeline where no merge request is open yet — GitLab's
# own recommended workflow, and the reason the second rule exists: without it a
# branch with an open MR would build twice, once as a branch pipeline and once
# as an MR pipeline, and the two would disagree about which SHA they tested.
# It is a superset of what was asked for, stated here rather than hidden in a
# job rule, because a feature branch ought to be able to see its own gate
# before it opens an MR.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Cases are scored against a committed baseline, so the job needs the commit
  # the baseline names to exist. A shallow clone of 1 is enough for the gate
  # itself; 20 keeps `git rev-parse HEAD` and a glance at recent history cheap.
  GIT_DEPTH: "20"

w2-eval-gate:
  stage: eval
  image: python:3.12-slim
  # `when: always` so a failed write-back suite does not SKIP this job. If the
  # suite goes red the gate must still run and say so — W2-K4 and W2-K6 fail
  # against its result file, and the gate's own verdict is then the truthful
  # one. Skipping here would leave the pipeline red with a gate that never
  # rendered an opinion, which is the state this whole file exists to avoid.
  when: always
  # Named explicitly: with no `dependencies:` a job downloads the artifacts of
  # every earlier job, and this pins it to the one that is actually evidence.
  dependencies:
    - w2-writeback-php
  tags:
    - w2-eval
  interruptible: true
  timeout: 30m
  cache:
    key:
      files:
        - agent/requirements.txt
        - agent/requirements-dev.txt
    paths:
      - .cache/pip
  before_script:
    # tesseract is not optional any more. Category B's scanned-page cases and
    # W2-C2 drive the OCR locate path, and they FAIL rather than skip without
    # it — a scanned case that goes green on an image with no OCR is exactly
    # the silent pass this gate exists to prevent.
    - apt-get update && apt-get install -y --no-install-recommends tesseract-ocr
    - tesseract --version | head -1
    - python -V
    - python -m pip install --upgrade pip
    - python -m pip install -r agent/requirements.txt -r agent/requirements-dev.txt
  script:
    - |
      if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
        echo "=============================================================================="
        echo "ANTHROPIC_API_KEY is not set in this job."
        echo "The judge tier will be SKIPPED, every category-M case will go unscored, and"
        echo "all of them are critical. THIS JOB WILL FAIL WITH EXIT 3 (INCOMPLETE)."
        echo "That is not a misconfiguration of the gate; it is the gate refusing to"
        echo "report green on a run that checked none of its critical cases."
        echo "Fix: Settings -> CI/CD -> Variables -> ANTHROPIC_API_KEY, MASKED and"
        echo "NOT PROTECTED, so merge-request pipelines can see it."
        echo "=============================================================================="
      else
        echo "ANTHROPIC_API_KEY is present: the judge tier will run (pinned model, best-of-3)."
      fi
    # No --allow-incomplete. See the header: a run that scored no critical case
    # must not report green, and exit 3 is how it says so.
    - cd agent
    - python -m evals.w2.gate --json "$CI_PROJECT_DIR/w2-gate-run.json"
  artifacts:
    when: always
    expire_in: 30 days
    name: "w2-gate-$CI_COMMIT_SHORT_SHA"
    paths:
      - w2-gate-run.json


# ---------------------------------------------------------------------------
# The PHP half of the write-back cases.
#
# W2-K4 is a critical case and its invariant — a failure mid-write leaves no
# ledger row AND no orphaned ciphertext file — cannot be asserted from Python.
# It lives in the fork's module, its proof is PHPUnit against faked
# collaborators, and this image has no PHP. So it is enforced by this job
# instead, and `agent/evals/w2/gate/checks_delegation.py` checks that the
# delegation is real: that this job exists, that it is not allowed to fail,
# and that the named test methods are still in the suite. A case marked
# `delegated` whose job has been deleted or neutered fails the Python gate.
#
# No `allow_failure`. That is the whole point: this job's failure fails the
# pipeline exactly as the eval gate's does, which is what "wired into the same
# verdict" has to mean when the two halves cannot share a process.
#
# Measured locally with the same images and the same commands:
# `composer install` 65 s cold, and the suite 143 tests / 294 assertions in
# 0.097 s.
w2-writeback-php:
  stage: writeback
  image: php:8.3-cli
  tags:
    - w2-eval
  interruptible: true
  timeout: 20m
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/
    # Default is on_success, and this job spent six pipelines failing at
    # `composer install` — so vendor/ was never produced, never cached, and
    # every run paid the full install again only to fail again. Saving on
    # failure too means a run that gets past the install and breaks in phpunit
    # still leaves a warm vendor/ for the next one.
    when: always
  before_script:
    # --ignore-platform-reqs: OpenEMR's root composer.json requires extensions
    # (gd, soap, mysqli, ...) that this module's tests never touch — its
    # bootstrap loads the autoloader and nothing else, no database and no
    # globals.php. Installing them into the image to satisfy a resolver check
    # would add minutes for classes that are never loaded.
    # --no-scripts: the post-install scripts are OpenEMR's asset pipeline.
    #
    # unzip and git: php:8.3-cli ships NEITHER, and has no zip extension and no
    # 7z either. Composer therefore cannot unpack a single dist archive, and
    # cannot fall back to --prefer-source because there is no git. All 248
    # packages fail and the job dies before phpunit is reached. It passed when
    # run by hand only because that used the composer:2 image, which has unzip.
    # Verified in the CI image: `docker run --rm php:8.3-cli` reports unzip,
    # 7z, git and the zip extension all MISSING; with these two packages
    # installed the same lock file resolves and all 248 unpack.
    - php -v
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends unzip git
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress --ignore-platform-reqs --no-scripts
  script:
    # The suite's exit code is captured rather than allowed to end the job,
    # because the result file has to be written on failure too — a delegated
    # case that goes unscored whenever the suite breaks would be enforced by
    # nothing precisely when it matters. The captured code is re-raised at the
    # end, so this job still fails exactly when phpunit fails.
    - |
      set +e
      vendor/bin/phpunit -c interface/modules/custom_modules/oe-module-clinical-copilot/phpunit.xml --log-junit "$CI_PROJECT_DIR/w2-writeback-php.xml"
      rc=$?
      set -e
      if [ "$rc" -eq 0 ]; then status=success; else status=failed; fi
      printf '{"schema":"w2-gate/delegated-result/1.0.0","job":"%s","commit":"%s","pipeline_id":"%s","job_id":"%s","job_url":"%s","exit_code":%d,"status":"%s","junit":"w2-writeback-php.xml"}\n' \
        "$CI_JOB_NAME" "$CI_COMMIT_SHA" "$CI_PIPELINE_ID" "$CI_JOB_ID" "$CI_JOB_URL" "$rc" "$status" \
        > "$CI_PROJECT_DIR/w2-writeback-php.result.json"
      cat "$CI_PROJECT_DIR/w2-writeback-php.result.json"
      exit "$rc"
  artifacts:
    when: always
    expire_in: 30 days
    name: "w2-writeback-php-$CI_COMMIT_SHORT_SHA"
    reports:
      junit: w2-writeback-php.xml
    paths:
      - w2-writeback-php.xml
      - w2-writeback-php.result.json


# ---------------------------------------------------------------------------
# The agent's unit suite, `agent/tests/`.
#
# Before this job nothing ran it in CI: the gate job runs `evals.w2.gate`, and
# the PHP job runs the module's PHPUnit suite. `tests/test_decisions_log.py`
# (D53) is the guard against a merge dropping a DECISIONS.md entry, and it
# guarded nothing on a merge request, because nothing on a merge request ran
# it. This job runs the whole suite, offline — no FHIR, no Anthropic key, no
# model call — and fails the pipeline when any test fails.
#
# In the `eval` stage with `needs: []`, so it starts at once and runs beside
# the other two without changing when or whether either of them runs. No
# `allow_failure`: a red suite is a red pipeline, and with "Pipelines must
# succeed" ticked, a refused merge.
#
# tesseract for the same reason as the gate job: the OCR tests skip without
# it, and a suite that skips its scanned-page tests on every CI run is not
# testing them. The final check fails the job if the decisions-log test was
# not collected, so renaming or deleting it cannot quietly remove the guard.
agent-unit-tests:
  stage: eval
  image: python:3.12-slim
  needs: []
  tags:
    - w2-eval
  interruptible: true
  timeout: 30m
  cache:
    key:
      files:
        - agent/requirements.txt
        - agent/requirements-dev.txt
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends tesseract-ocr
    - tesseract --version | head -1
    - python -V
    - python -m pip install --upgrade pip
    - python -m pip install -r agent/requirements.txt -r agent/requirements-dev.txt
  script:
    - cd agent
    # `tests` named explicitly: a bare pytest is pinned to it by testpaths,
    # but `pytest evals` is the live suite, and this job must never be that.
    - python -m pytest tests -p no:cacheprovider --junitxml="$CI_PROJECT_DIR/agent-unit-tests.xml"
    - |
      if ! grep -q 'classname="tests.test_decisions_log"' "$CI_PROJECT_DIR/agent-unit-tests.xml"; then
        echo "tests/test_decisions_log.py was not collected: the DECISIONS.md numbering guard did not run."
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 30 days
    name: "agent-unit-tests-$CI_COMMIT_SHORT_SHA"
    reports:
      junit: agent-unit-tests.xml
    paths:
      - agent-unit-tests.xml


# ---------------------------------------------------------------------------
# The patient dashboard port, `dashboard/` (work order 31, D59; job added by
# work order 33, D61).
#
# Strict typecheck of the SPA and the BFF, the unit suite, and the production
# build: `npm ci && npm run typecheck && npm test && npm run build`, as
# PATIENT_DASHBOARD_MIGRATION.md §8 proposed. No credential, no network
# beyond the npm registry, and about 40 s from a cold image. The e2e suite is
# not here: it drives the real OpenEMR stack and stays a local, pre-merge
# step.
#
# Created only when the pipeline's changes touch `dashboard/`, or this file,
# so an edit that breaks the job's own definition is seen by the job.
# `rules: changes` compares an MR pipeline with its target branch; on the
# first push of a new branch GitLab has no base and always creates the job.
# `needs: []` and no `allow_failure`, as with `agent-unit-tests`: it runs at
# once, beside the others, and a red suite is a red pipeline.
#
# node:24 because the Dockerfile builds on Node 24 and package.json asks for
# >= 22. `npm ci` installs from the committed lock file and fails if it is out
# of step with package.json. @playwright/test installs no browser on its own,
# so nothing here downloads Chrome.
dashboard-tests:
  stage: eval
  image: node:24
  needs: []
  tags:
    - w2-eval
  interruptible: true
  timeout: 15m
  rules:
    - changes:
        - dashboard/**/*
        - .gitlab-ci.yml
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key:
      files:
        - dashboard/package-lock.json
    paths:
      - .cache/npm
  script:
    - node -v
    - npm -v
    - cd dashboard
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test -- --reporter=default --reporter=junit --outputFile.junit="$CI_PROJECT_DIR/dashboard-tests.xml"
    - npm run build
  artifacts:
    when: always
    expire_in: 30 days
    name: "dashboard-tests-$CI_COMMIT_SHORT_SHA"
    reports:
      junit: dashboard-tests.xml
    paths:
      - dashboard-tests.xml
